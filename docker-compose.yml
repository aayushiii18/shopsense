version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: shopsense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-shopsense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopsense}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopsense-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: shopsense-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-shopsense}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsense.internal}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure123!}
      SECRET_KEY: ${SECRET_KEY:-shopsense-dev-insecure-key-change-in-production}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shopsense-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: shopsense-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-shopsense}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shopsense-network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: shopsense-mlflow
    restart: unless-stopped
    entrypoint: []
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shopsense-network

volumes:
  postgres_data:
    name: shopsense-postgres-data
  mlflow_data:
    name: shopsense-mlflow-data

networks:
  shopsense-network:
    name: shopsense-network
    driver: bridge
