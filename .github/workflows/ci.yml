name: ShopSense CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Test & Invariant Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: shopsense_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopsense_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/shopsense_ci
      TEST_DATABASE_URL: sqlite:///./test_shopsense.db
      ADMIN_EMAIL: admin@shopsense.internal
      ADMIN_PASSWORD: AdminSecure123!
      SECRET_KEY: ci-test-secret-key-32-bytes-minimum-string-length!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax & Compilation Checks
        run: |
          python -m py_compile app/main.py
          python -m py_compile dashboard/dashboard.py
          python -m py_compile docker_entrypoint.py
          python -m py_compile bootstrap_admin.py
          python -c "import ast, glob; [ast.parse(open(f, encoding='utf-8').read(), filename=f) for f in glob.glob('app/**/*.py', recursive=True)]; print('All application files parsed successfully.')"

      - name: Database Initialization & Migrations
        run: |
          python create_tables.py
          python migrate_stage7.py
          python seed_data.py
          python bootstrap_admin.py --email admin@shopsense.internal --password AdminSecure123!

      - name: Run Platform Consistency Validation
        run: |
          python validate_consistency.py

      - name: Run Stage 7 Authentication & Security Test Suite
        run: |
          pytest tests/test_stage7_auth_security.py -v

      - name: Run Complete Repository Regression Test Suite
        run: |
          pytest tests/ -v

      - name: Verify Streamlit Dashboard AppTest
        run: |
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('dashboard/dashboard.py').run(timeout=60); assert len(at.exception) == 0; print('Dashboard verified with 0 exceptions across all views.')"
